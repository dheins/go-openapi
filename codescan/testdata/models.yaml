# testdata/models/models.go:119:2: warning: chan bool values are not encoded as JSON; they are left untyped
openapi: 3.1.0
info:
  title: github.com/dheins/go-openapi/codescan/testdata/models
  version: 0.0.0
components:
  schemas:
    Pet:
      $id: Pet
      properties:
        id:
          type: integer
          format: int64
          description: ID is assigned by the store.
          readOnly: true
        name:
          type: string
          maxLength: 50
          minLength: 1
          examples:
            - Rex
        kind:
          $ref: Kind
          default: dog
        tag:
          type: string
        nickname:
          type:
            - string
            - "null"
          description: Nickname may be null.
        owner:
          $ref: Owner
        tags:
          items:
            type: string
          type: array
          maxItems: 10
          uniqueItems: true
        scores:
          additionalProperties:
            type: number
          type: object
        born:
          type: string
          format: date
        seen:
          type: string
          format: date-time
        photo:
          type: string
          contentEncoding: base64
        weight:
          type: string
        age:
          type: integer
          maximum: 40
          minimum: 0
          format: int32
        extra: {}
        anything: {}
        parent:
          $ref: Pet
        friends:
          items:
            $ref: PetID
          type: array
          maxItems: 2
          minItems: 2
        address:
          type: string
        note:
          type:
            - string
            - "null"
          pattern: ^[a-z;]*$
        created:
          type: string
          format: date-time
        by:
          type: string
        meta:
          $ref: Meta
        label:
          type: string
          deprecated: true
      type: object
      required:
        - id
        - name
        - kind
        - nickname
        - seen
        - weight
        - age
        - friends
        - note
        - created
        - meta
      description: |-
        Pet is a pet in the store.

        It is the main type of the fixture.
    Kind:
      $id: Kind
      type: string
      enum:
        - dog
        - cat
      description: Kind is the kind of a pet.
    Owner:
      $id: Owner
      properties:
        name:
          type: string
        other:
          $ref: SharedOwner
        level:
          $ref: Level
      type: object
      required:
        - name
        - level
      description: Owner is a pet's owner; its name clashes with shared.Owner.
    SharedOwner:
      $id: SharedOwner
      properties:
        email:
          type: string
          format: email
      type: object
      required:
        - email
      description: Owner is an owner, from another package.
    Level:
      $id: Level
      type: integer
      enum:
        - 1
        - 3
      format: int64
      description: Level is a numeric enum.
    PetID:
      $id: PetID
      type: integer
      format: int64
      description: PetID identifies a pet.
    Meta:
      $id: Meta
      properties:
        version:
          type: integer
          format: int64
      type: object
      required:
        - version
      description: Meta is embedded in Pet under a name.
    PetPage:
      $id: PetPage
      $ref: Page
      $defs:
        T:
          $ref: Pet
          $dynamicAnchor: T
      description: Pets is a page of pets, named by the directive.
    Page:
      $id: Page
      $defs:
        T:
          $dynamicAnchor: T
      properties:
        items:
          items:
            $dynamicRef: '#T'
          type: array
        next:
          type: string
      type: object
      required:
        - items
      description: Page is a page of items.
    PetEnvelope:
      $id: PetEnvelope
      $ref: Envelope
      $defs:
        T:
          $ref: Pet
          $dynamicAnchor: T
      description: PetEnvelope is an envelope of pets.
    Envelope:
      $id: Envelope
      $defs:
        T:
          $dynamicAnchor: T
      properties:
        data:
          properties:
            items:
              items:
                $dynamicRef: '#T'
              type: array
            next:
              type: string
          type: object
          required:
            - items
      type: object
      required:
        - data
      description: Envelope wraps a page of items.
    Upload:
      $id: Upload
      properties:
        file:
          type: string
          format: binary
        done: {}
        pages:
          $ref: PageOwner
      type: object
      required:
        - file
      description: Upload holds a file.
    PageOwner:
      $id: PageOwner
      $ref: Page
      $defs:
        T:
          $ref: Owner
          $dynamicAnchor: T
      description: Page is a page of items.
    Feeding:
      $id: Feeding
      properties:
        diet:
          $ref: Diet
        contact:
          $ref: Contact
        backup:
          anyOf:
            - $ref: Diet
            - type: "null"
      type: object
      required:
        - diet
        - backup
      description: Feeding uses the unions.
    Diet:
      $id: Diet
      oneOf:
        - $ref: Omnivore
        - $ref: Herbivore
        - $ref: Carnivore
      required:
        - kind
      description: Diet is what a pet eats.
      discriminator:
        propertyName: kind
        mapping:
          Omnivore: Omnivore
          Herbivore: Herbivore
          meat: Carnivore
    Omnivore:
      $id: Omnivore
      properties:
        kind:
          type: string
      type: object
      required:
        - kind
      description: Omnivore eats anything; a variant of models.Diet from another package.
    Herbivore:
      $id: Herbivore
      properties:
        kind:
          type: string
        plants:
          items:
            type: string
          type: array
      type: object
      required:
        - kind
        - plants
      description: Herbivore eats plants.
    Carnivore:
      $id: Carnivore
      properties:
        kind:
          type: string
        prey:
          type: string
      type: object
      required:
        - kind
        - prey
      description: Carnivore eats meat; a Diet through its pointer.
    Contact:
      $id: Contact
      anyOf:
        - $ref: Email
        - $ref: Phone
      description: 'Contact is how to reach an owner: any of its variants may match.'
    Email:
      $id: Email
      type: string
      description: Email is an email address.
    Phone:
      $id: Phone
      properties:
        number:
          type: string
      type: object
      required:
        - number
      description: Phone is a phone number.
