openapi: 3.1.0
info:
  title: Bad
  version: "1"
paths:
  /x/{id}/{gone}:
    get:
      operationId: many
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: M
          in: query
          schema:
            type: string
        - name: E
          in: query
          explode: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: string
              contentEncoding: base64
        required: true
      responses:
        "200":
          description: OK.
      security:
        - nobody: []
  /dup:
    get:
      operationId: same
      responses:
        "200":
          description: OK.
      callbacks:
        event:
          '{$request.body#/url}':
            post:
              operationId: callbackOnce
              responses:
                "204":
                  description: No Content.
  /examples:
    post:
      operationId: examples
      requestBody:
        content:
          application/json:
            schema:
              type: string
          text/plain:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: string
              example: 2
              examples:
                a:
                  value: 4
        "204":
          description: No Content.
  /links:
    get:
      operationId: links
      responses:
        "200":
          description: OK.
          links:
            missing:
              operationId: nosuchop
            next:
              operationId: examples
  /parts:
    post:
      operationId: parts
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Parts'
            encoding:
              a: {}
              b: {}
        required: true
      responses:
        "204":
          description: No Content.
webhooks:
  hook:
    post:
      operationId: hookWithPath
      responses:
        "204":
          description: No Content.
  again:
    post:
      operationId: hookOnce
      responses:
        "204":
          description: No Content.
components:
  schemas:
    Parts:
      properties:
        a:
          type: string
        b:
          type: string
      type: object
      required:
        - a
        - b
      description: Parts has encodings codescan rejects.
