openapi: 3.1.0
info:
  title: Bad
  version: "1"
paths:
  /x/{id}/{gone}:
    get:
      operationId: many
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: M
          in: query
          schema:
            type: string
        - name: E
          in: query
          explode: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: string
              contentEncoding: base64
        required: true
      responses:
        "200":
          description: OK.
      security:
        - nobody: []
  /dup:
    get:
      operationId: same
      responses:
        "200":
          description: OK.
