openapi: 3.1.0
info:
  title: Scanned pets
  version: 1.0.0
servers:
  - url: https://pets.example.com/v1
paths:
  /pets:
    get:
      tags:
        - pets
      description: ListPets lists the pets.
      operationId: listPets
      parameters:
        - name: limit
          in: query
          description: Limit is the most pets to return.
          schema:
            type: integer
            maximum: 100
            minimum: 1
            format: int32
            default: 20
          example: 10
        - name: kind
          in: query
          description: Kinds are the kinds to return.
          explode: false
          schema:
            items:
              $ref: '#/components/schemas/Kind'
            type: array
      responses:
        "200":
          description: OK.
          headers:
            X-Total:
              required: true
              schema:
                type: integer
                format: int64
              example: 2
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Pet'
                type: array
        default:
          description: Default response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
        - pets
      description: CreatePet adds a pet.
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
            example:
              name: Rex
              kind: dog
        required: true
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
          links:
            GetPet:
              operationId: getPet
              parameters:
                id: $response.body#/id
        "409":
          description: Conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /pets/{id}:
    get:
      tags:
        - pets
      description: GetPet returns a pet.
      operationId: getPet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            format: int64
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              examples:
                rex:
                  summary: A dog
                  value:
                    id: 1
                    name: Rex
                    kind: dog
        "404":
          description: Not Found.
    delete:
      tags:
        - pets
      description: DeletePet removes a pet.
      operationId: deletePet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            format: int64
      responses:
        "204":
          description: No Content.
      security:
        - apiKey: []
  /pets/{id}/photo:
    put:
      tags:
        - pets
      description: PutPhoto stores a pet's photo.
      operationId: putPhoto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          image/png:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "204":
          description: No Content.
  /pets/{id}/uploads:
    post:
      tags:
        - pets
      description: UploadPhoto stores a pet's photo, with its caption.
      operationId: uploadPhoto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Upload'
            encoding:
              photo:
                contentType: image/png, image/jpeg
                headers:
                  X-Checksum:
                    required: true
                    schema:
                      type: string
        required: true
      responses:
        "204":
          description: No Content.
  /subscriptions:
    post:
      tags:
        - pets
      description: Subscribe registers a URL for pet events.
      operationId: subscribe
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
        required: true
      responses:
        "201":
          description: Created.
      callbacks:
        petEvent:
          '{$request.body#/url}/pets':
            post:
              description: NotifyPet sends a subscriber a pet event, with a key or none.
              operationId: notifyPet
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Pet'
                required: true
              responses:
                "204":
                  description: No Content.
              security:
                - apiKey: []
                - {}
webhooks:
  petAdopted:
    post:
      tags:
        - pets
      description: |-
        PetAdopted tells a consumer that a pet was adopted, with the key the
        consumer issued.
      operationId: petAdopted
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Adoption'
        required: true
      responses:
        "204":
          description: No Content.
      security:
        - apiKey: []
components:
  schemas:
    Pet:
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 40
          minLength: 1
        kind:
          $ref: '#/components/schemas/Kind'
        tag:
          type: string
        born:
          type: string
          format: date
        diet:
          $ref: '#/components/schemas/Diet'
      type: object
      required:
        - id
        - name
        - kind
      description: Pet is a pet in the store.
    Kind:
      type: string
      enum:
        - dog
        - cat
      description: Kind is the kind of a pet.
    Diet:
      oneOf:
        - $ref: '#/components/schemas/Herbivore'
        - $ref: '#/components/schemas/Carnivore'
      required:
        - type
      description: Diet is what a pet eats.
      discriminator:
        propertyName: type
        mapping:
          Herbivore: '#/components/schemas/Herbivore'
          meat: '#/components/schemas/Carnivore'
    Herbivore:
      properties:
        type:
          type: string
        plants:
          items:
            type: string
          type: array
      type: object
      required:
        - type
      description: Herbivore eats plants.
    Carnivore:
      properties:
        type:
          type: string
        prey:
          type: string
          minLength: 1
      type: object
      required:
        - type
        - prey
      description: Carnivore eats meat.
    Problem:
      properties:
        title:
          type: string
        detail:
          type: string
      type: object
      required:
        - title
      description: Problem is an error.
    Upload:
      properties:
        photo:
          type: string
          format: binary
        caption:
          type: string
          maxLength: 40
      type: object
      required:
        - photo
      description: Upload is a pet's photo with a caption.
    Adoption:
      properties:
        pet:
          $ref: '#/components/schemas/Pet'
        by:
          type: string
          minLength: 1
      type: object
      required:
        - pet
        - by
      description: Adoption is sent when a pet is adopted.
    Subscription:
      properties:
        url:
          type: string
          format: uri
      type: object
      required:
        - url
      description: Subscription is where to send pet events.
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
tags:
  - name: pets
    description: Pets and their photos
