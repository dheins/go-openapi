openapi: 3.2.0
info:
  title: Semantic rule violations
  version: "1"
servers:
  - url: https://{region}.example.com/{stage}
    variables:
      region:
        default: eu
        enum: [us, ap]
      unused:
        default: x
tags:
  - name: a
    parent: b
  - name: b
    parent: a
  - name: a
  - name: c
    parent: missing
paths:
  /pets/{id}:
    parameters:
      - name: q
        in: querystring
        content:
          application/json:
            schema: {type: object}
    get:
      operationId: getPet
      security:
        - nope: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer}
        - name: other
          in: path
          required: true
          schema: {type: string}
        - name: X-Trace
          in: header
          schema: {type: string}
        - name: x-trace
          in: header
          schema: {type: string}
      responses:
        "200":
          description: ok
          links:
            next:
              operationId: missingOp
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: ok}
components:
  schemas:
    Animal:
      type: object
      discriminator:
        propertyName: kind
    Cyclic:
      allOf:
        - $ref: "#/components/schemas/Cyclic2"
      discriminator:
        propertyName: kind
    Cyclic2:
      allOf:
        - $ref: "#/components/schemas/Cyclic"
    Clash:
      allOf:
        - properties: {size: {type: string}}
        - properties: {size: {type: integer}}
    Narrow:
      allOf:
        - properties: {size: {type: integer}}
        - properties: {size: {type: number, maximum: 3}}
    Picked:
      allOf:
        - properties: {mode: {enum: [a, b]}}
        - properties: {mode: {const: c}}
    Outer:
      allOf:
        - $ref: "#/components/schemas/Clash"
    Payment:
      oneOf:
        - type: object
          required: [card]
          properties: {card: {type: string}}
        - type: object
          required: [iban]
          properties: {iban: {type: string}}
    Tagged:
      oneOf:
        - {type: object, required: [kind], properties: {kind: {const: a}}}
        - {type: object, required: [kind], properties: {kind: {const: b}}}
    Closed:
      oneOf:
        - {type: object, required: [a], properties: {a: {type: string}}, additionalProperties: false}
        - {type: object, required: [b], properties: {b: {type: string}}, additionalProperties: false}
    OneField:
      type: object
      properties: {email: {type: string}, phone: {type: string}}
      oneOf:
        - required: [email]
        - required: [phone]
    Patterns:
      type: object
      properties:
        good: {type: string, pattern: "^(?=.*[0-9]).{8,}$"}
        bad: {type: string, pattern: "(?=unclosed"}
      patternProperties:
        "[": {type: string}
