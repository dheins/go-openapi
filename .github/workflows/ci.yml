name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./... ./codegen/testdata/golden/...
      - name: Test
        # Includes the golden files (TestGolden), and compiling, vetting and
        # testing the generated golden packages (TestGeneratedCode).
        run: go test ./... ./codegen/testdata/golden/...

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Race detector
        run: go test -race ./... ./codegen/testdata/golden/...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Benchmarks still run
        run: go test -run='^$' -bench=. -benchtime=1x ./loader ./validate ./codegen ./codegen/testdata/golden/petstore ./codegen/testdata/golden/petserver

  modules:
    # Modules of their own, so the core module does not depend on zap or
    # OpenTelemetry; each builds against this checkout through replace.
    name: Module (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module: [contrib/zaplog, contrib/otel, examples/petstore]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Generated code is up to date
        if: matrix.module == 'examples/petstore'
        run: |
          go generate ./...
          git diff --exit-code
          test -z "$(git status --porcelain .)" || { git status --porcelain .; exit 1; }

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz every target briefly
        run: |
          set -e
          while read -r pkg target; do
            echo "::group::$pkg $target"
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=10s "./$pkg"
            echo "::endgroup::"
          done <<'TARGETS'
          loader FuzzLoadBytes
          validate FuzzSource
          oapi FuzzDecode
          oapi FuzzDecodeScalar
          oapi FuzzEnsureProperty
          runtime/server FuzzParamStyles
          runtime/server FuzzNegotiate
          runtime/server FuzzMultipart
          codegen/testdata/golden/petstore FuzzModels
          TARGETS
